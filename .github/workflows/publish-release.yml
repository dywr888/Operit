name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run ID whose APK artifact should be published
        required: true
      tag:
        description: Release tag (e.g. v1.12.2-fork.1)
        required: true
      title:
        description: Release title
        required: true
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false
      asset_name:
        description: Asset file name in release
        required: true
        default: app-nightly.apk

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish APK from build run
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: operit-android-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f | sed 's/^/  /' || true
          test -n "$(find dist -name '*.apk' -print -quit)"

      - name: Normalize asset name
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find dist -name 'app-nightly.apk' -print -quit)
          if [ -z "$apk" ]; then apk=$(find dist -name '*.apk' -print -quit); fi
          mkdir -p out
          cp "$apk" "out/${{ inputs.asset_name }}"
          ls -l out
          sha256sum "out/${{ inputs.asset_name }}" | tee out/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          prerelease: ${{ inputs.prerelease }}
          draft: false
          files: out/*
          body: |
            Community build produced by GitHub Actions (fork repo, no official signing keys).

            - Build run: #${{ inputs.run_id }}
            - Workflow artifact: `operit-android-*`
            - Variant: `assembleNightly` (applicationId `com.ai.assistance.operit`, debug signing)

            `app-nightly.apk` uses the Android debug keystore, so it does **not** share a
            signature with official Operit releases. Uninstall the official build first,
            or expect an `INSTALL_FAILED_UPDATE_INCOMPATIBLE` failure.
            `SHA256SUMS.txt` contains the APK checksum.
